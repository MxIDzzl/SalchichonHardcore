# SalchichonHardcore - Configuracion principal

settings:
  timezone: "America/Mexico_City"
  daily-reset: "00:00"

# PostgreSQL queda preparado pero DESACTIVADO.
# El plugin seguirá usando hardcore.db hasta completar y verificar el importador.
# Define SALCHICHON_DB_USER y SALCHICHON_DB_PASSWORD en el entorno del servidor.
database:
  postgresql:
    enabled: false
    host: "127.0.0.1"
    port: 5432
    database: "salchichon"
    username-env: "SALCHICHON_DB_USER"
    password-env: "SALCHICHON_DB_PASSWORD"
    pool:
      maximum-size: 8
      minimum-idle: 2
      connection-timeout-ms: 10000
      validation-timeout-ms: 5000
      max-lifetime-ms: 1800000

# Player Value incluye visor y depósitos con marcador/reconciliación. Los retiros siguen sin habilitarse;
# mantenerlo apagado hasta completar pruebas de integración y validación en staging.
player-value:
  enabled: false
  cooldown-seconds: 5
  max-stack-size-per-operation: 64
  allowed-items:
    DIAMOND: 10
    EMERALD: 6
    NETHERITE_INGOT: 100
    ANCIENT_DEBRIS: 25
    GOLD_INGOT: 2

season:
  name: "UHC SEASON 1"
  start-date: "2026-10-19"
  difficulty: "HARD"

messages:
  no-permission: "&cNo tienes permiso para utilizar este comando."
  no-data: "&cNo se encontraron datos de ese jugador."
  no-life: "&c¡Has perdido tu vida diaria!"
  return-tomorrow: "&7Podrás regresar mañana a las 00:00."
  data-error: "&cNo se pudieron cargar tus datos."
  restore-success: "&a¡Un administrador te ha restaurado tu vida!"
  reset-success: "&aTu contador de muerte ha sido reiniciado."

bossbar:
  available:
    text: "&aVIDA DISPONIBLE"
    color: GREEN
  unavailable:
    text: "&cSIN VIDAS"
    color: RED

# Intercambios de objetos; Player Value no se puede transferir.
trade:
  enabled: false
