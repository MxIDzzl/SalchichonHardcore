name: SalchichonHardcore
version: 1.0.0
main: com.escuadronsalchichon.hardcore.SalchichonHardcore
api-version: '26.3'
author: EscuadronSalchichon
description: Sistema hardcore diario para Escuadron Salchichon.

softdepend:
  - PlaceholderAPI
  - SkinsRestorer
  - zMClans

commands:
  value:
    description: Abre tu almacén personal Player Value
    usage: /value [página] | /value deposit
  hardcore:
    description: Comandos administrativos de SalchichonHardcore
    usage: /hardcore <check|restore|reset|stat|vault-status|reload>
    permission: salchichonhardcore.admin

permissions:
  salchichonhardcore.admin:
    description: Permite administrar SalchichonHardcore
    default: op
