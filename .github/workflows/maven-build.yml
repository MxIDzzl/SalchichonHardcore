name: Maven build

on:
  push:
    branches:
      - main
      - feature/postgresql-foundation
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Verify (${{ matrix.database.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        database:
          - name: MySQL 8.4
            image: mysql:8.4
            health-command: mysqladmin ping -h 127.0.0.1 -proot-test-password
          - name: MariaDB 11.4
            image: mariadb:11.4
            health-command: healthcheck.sh --connect --innodb_initialized
          - name: MariaDB 10.11
            image: mariadb:10.11
            health-command: healthcheck.sh --connect --innodb_initialized
    env:
      SALCHICHON_MYSQL_TEST_URL: jdbc:mysql://127.0.0.1:3306/salchichon?useSSL=false&allowPublicKeyRetrieval=true
      SALCHICHON_MYSQL_TEST_USER: root
      SALCHICHON_MYSQL_TEST_PASSWORD: root-test-password
    services:
      database:
        image: ${{ matrix.database.image }}
        env:
          MYSQL_ROOT_PASSWORD: root-test-password
          MYSQL_DATABASE: salchichon
        ports:
          - 3306:3306
        options: >-
          --health-cmd="${{ matrix.database.health-command }}"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Verify
        run: mvn --batch-mode --no-transfer-progress clean verify
      - name: Upload test plugin
        if: success() && github.ref == 'refs/heads/feature/postgresql-foundation' && matrix.database.name == 'MySQL 8.4'
        uses: actions/upload-artifact@v4
        with:
          name: SalchichonHardcore-test-${{ github.sha }}
          path: target/SalchichonHardcore-1.0.0.jar
          if-no-files-found: error
          retention-days: 7
