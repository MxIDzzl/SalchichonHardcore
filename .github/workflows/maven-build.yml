name: Maven build

on:
  push:
    branches:
      - main
      - feature/postgresql-foundation
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SALCHICHON_MYSQL_TEST_URL: jdbc:mysql://127.0.0.1:3306/salchichon?useSSL=false&allowPublicKeyRetrieval=true
      SALCHICHON_MYSQL_TEST_USER: root
      SALCHICHON_MYSQL_TEST_PASSWORD: root-test-password
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root-test-password
          MYSQL_DATABASE: salchichon
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot-test-password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Verify
        run: mvn --batch-mode --no-transfer-progress clean verify
      - name: Upload test plugin
        if: success() && github.ref == 'refs/heads/feature/postgresql-foundation'
        uses: actions/upload-artifact@v4
        with:
          name: SalchichonHardcore-test-${{ github.sha }}
          path: target/SalchichonHardcore-1.0.0.jar
          if-no-files-found: error
          retention-days: 7
