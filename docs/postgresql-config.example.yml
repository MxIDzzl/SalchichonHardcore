# PostgreSQL connection template.
# Configure these values in the host's environment/secret manager, not in Git.
# Keep PostgreSQL bound to localhost/private network; never expose port 5432 publicly.
database:
  type: postgresql
  host: 127.0.0.1
  port: 5432
  name: salchichon
  username: ${SALCHICHON_DB_USER}
  password: ${SALCHICHON_DB_PASSWORD}
  pool:
    maximum-size: 8
    minimum-idle: 2
    connection-timeout-ms: 5000
    idle-timeout-ms: 600000
    max-lifetime-ms: 1800000
  ssl:
    enabled: false
    # Enable and configure certificate verification when DB is on a separate private host.
